<!DOCTYPE html>
<html lang="he" dir="rtl" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="description" content="עוזר טיול בזמן אמת לחופשה משפחתית באוסטריה — מסלול, לינה ובנק אטרקציות עם חיפוש ומיקום GPS.">
<title>אוסטריה 2026 — עוזר הטיול</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏔️</text></svg>">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { ink: '#0f172a' },
        fontFamily: { sans: ['-apple-system','BlinkMacSystemFont','Segoe UI','Roboto','Helvetica Neue','Arial','sans-serif'] }
      }
    }
  }
</script>

<style>
  /* Respect the iPhone home-bar / notch */
  .safe-b { padding-bottom: calc(0.5rem + env(safe-area-inset-bottom)); }
  .safe-t { padding-top: env(safe-area-inset-top); }

  /* Horizontal filter rails: swipeable, no visible scrollbar */
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  .no-scrollbar::-webkit-scrollbar { display: none; }

  /* Native-feeling momentum + snap on the chip rails */
  .rail { scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
  .rail > * { scroll-snap-align: start; }

  /* Prevent iOS zoom-on-focus (needs >=16px) */
  input, select, textarea { font-size: 16px; }

  /* We draw our own clear button (#btn-clear-search) because iOS Safari draws
     none — suppress the desktop one so there's never two. */
  input[type="search"]::-webkit-search-cancel-button,
  input[type="search"]::-webkit-search-decoration { -webkit-appearance: none; appearance: none; }

  /* Filter bar sticks right under the header; --hdr is measured in app.js */
  .stick-below-hdr { position: sticky; top: var(--hdr, 60px); }

  details > summary { list-style: none; cursor: pointer; }  details > summary::-webkit-details-marker { display: none; }
  details[open] .chev { transform: rotate(180deg); }

  @media (prefers-reduced-motion: no-preference) {
    .fade-in { animation: fade .25s ease-out both; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  }
</style>
</head>

<body class="h-full bg-slate-100 text-ink antialiased">

<!-- ============ HEADER ============ -->
<header class="safe-t sticky top-0 z-30 bg-ink text-white shadow-lg">
  <div class="px-4 pt-3 pb-3 flex items-center gap-3">
    <div class="text-2xl leading-none">🏔️</div>
    <div class="min-w-0 flex-1">
      <h1 id="trip-title" class="text-base font-semibold leading-tight truncate">אוסטריה 2026</h1>
      <p id="trip-dates" class="text-[11px] text-slate-300 leading-tight truncate"></p>
    </div>
    <div id="trip-status" class="text-right text-[11px] text-slate-300 leading-tight shrink-0"></div>
  </div>
</header>

<!-- ============ MAIN ============ -->
<main class="mx-auto w-full max-w-2xl px-3 pb-28 pt-3">

  <!-- ---------- TAB 1: ITINERARY ---------- -->
  <section id="view-itinerary" class="space-y-6"></section>

  <!-- ---------- TAB 2: PLANNER + READY-MADE DAY PLANS ---------- -->
  <section id="view-plans" class="space-y-4" hidden></section>

  <!-- ---------- TAB 3: JOURNEY LOG ---------- -->
  <section id="view-journey" class="space-y-4" hidden></section>

  <!-- ---------- TAB 4: ATTRACTION BANK ---------- -->
  <section id="view-attractions" class="space-y-3" hidden>

    <!-- search + geo -->
    <div class="stick-below-hdr z-20 -mx-3 bg-slate-100/95 px-3 pt-1 pb-2 backdrop-blur">
      <div class="flex gap-2">
        <div class="relative flex-1">
          <span class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-slate-400">🔎</span>
          <input id="search" type="search" inputmode="search" autocomplete="off"
                 placeholder="חיפוש אטרקציות, אוכל, תגיות…"
                 class="w-full rounded-xl border border-slate-300 bg-white py-2.5 pr-9 pl-10 shadow-sm outline-none focus:border-ink focus:ring-2 focus:ring-ink/20">
          <!-- No display utility here (grid/flex): Tailwind's utilities layer would
               beat preflight's [hidden]{display:none} and the button would never hide.
               A button centres its own label anyway. -->
          <button id="btn-clear-search" type="button" hidden aria-label="נקה חיפוש"
                  class="absolute left-1.5 top-1/2 h-7 w-7 -translate-y-1/2 rounded-full bg-slate-200 text-xs leading-none text-slate-500 active:scale-90 transition">✕</button>
        </div>
        <button id="btn-nearby" type="button"
                class="shrink-0 rounded-xl bg-ink px-3.5 py-2.5 text-sm font-semibold text-white shadow-sm active:scale-95 transition">
          <span id="nearby-label">📍 קרוב אליי</span>
        </button>
      </div>

      <!-- category rail (with pinned clear button that never scrolls away) -->
      <div class="mt-2 flex items-center gap-2">
        <button id="btn-clear-cat" type="button" hidden
                class="shrink-0 rounded-full bg-ink px-3 py-1.5 text-xs font-semibold text-white shadow-sm active:scale-95 transition">
        </button>
        <div id="cat-rail" class="rail no-scrollbar flex gap-2 overflow-x-auto pb-0.5"></div>
      </div>

      <!-- secondary filters -->
      <div class="mt-2 flex flex-wrap items-center gap-2 text-xs">
        <div id="weather-rail" class="flex gap-1 rounded-lg bg-slate-200 p-0.5"></div>
        <div id="region-rail" class="flex gap-1 rounded-lg bg-slate-200 p-0.5"></div>
        <div id="status-rail" class="flex gap-1 rounded-lg bg-slate-200 p-0.5"></div>
        <select id="priority"
                class="rounded-lg border border-slate-300 bg-white px-2 py-1.5 text-xs shadow-sm outline-none focus:border-ink">
          <option value="1">כל העדיפויות</option>
          <option value="2">גבוהה וחובה</option>
          <option value="3">חובה בלבד</option>
        </select>
        <button id="btn-reset" type="button"
                class="ml-auto rounded-lg px-2 py-1.5 text-xs font-medium text-slate-500 underline-offset-2 hover:underline">
          איפוס
        </button>
      </div>
    </div>

    <!-- status line -->
    <p id="results-status" class="px-1 text-xs text-slate-500" aria-live="polite"></p>

    <!-- cards -->
    <div id="attraction-list" class="space-y-3"></div>
    <!-- Hidden via the attribute, not a .hidden class: renderAttractions() toggles
         the property, and a utility class would sit there overriding it forever. -->
    <p id="empty-state" hidden class="rounded-2xl bg-white p-8 text-center text-sm text-slate-500 shadow-sm">
      אין מקומות שמתאימים לסינון הזה.<br>נסו להרחיב את מזג האוויר או העדיפות.
    </p>
  </section>

  <p id="data-note" class="mt-6 px-2 text-center text-[11px] leading-relaxed text-slate-400"></p>
  <!-- Which build this device is actually running — the quickest way to tell a
       deploy problem from a cache problem. -->
  <p id="app-version" class="mt-1 px-2 text-center text-[10px] text-slate-300" dir="ltr"></p>
</main>

<!-- ============ BOTTOM NAV ============ -->
<nav class="safe-b fixed inset-x-0 bottom-0 z-40 border-t border-slate-200 bg-white/95 pt-1.5 backdrop-blur">
  <div class="mx-auto flex max-w-2xl">
    <button data-tab="itinerary" type="button"
            class="tab-btn flex flex-1 flex-col items-center gap-0.5 py-1.5 text-[11px] font-medium text-slate-400 transition">
      <span class="text-xl leading-none">🧭</span><span>מסלול</span>
    </button>
    <button data-tab="plans" type="button"
            class="tab-btn flex flex-1 flex-col items-center gap-0.5 py-1.5 text-[11px] font-medium text-slate-400 transition">
      <span class="text-xl leading-none">🗓️</span><span>תכנית</span>
    </button>
    <button data-tab="journey" type="button"
            class="tab-btn flex flex-1 flex-col items-center gap-0.5 py-1.5 text-[11px] font-medium text-slate-400 transition">
      <span class="text-xl leading-none">📖</span><span>יומן</span>
    </button>
    <button data-tab="attractions" type="button"
            class="tab-btn flex flex-1 flex-col items-center gap-0.5 py-1.5 text-[11px] font-medium text-slate-400 transition">
      <span class="text-xl leading-none">📍</span><span>אטרקציות</span>
    </button>
  </div>
</nav>

<!-- ============ ADD / EDIT SHEET ============ -->
<!-- One sheet serves four jobs: plan a place, log a visit, add a manual place,
     edit an existing entry. Hidden via the attribute with no display utility on
     the element itself — Tailwind's utilities layer beats [hidden]{display:none}. -->
<div id="sheet-backdrop" hidden class="fixed inset-0 z-50 bg-ink/40 backdrop-blur-sm"></div>
<div id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title"
     class="safe-b fixed inset-x-0 bottom-0 z-50 max-h-[88vh] overflow-y-auto rounded-t-3xl bg-white px-4 pt-3 shadow-2xl">

  <div class="mx-auto mb-3 h-1.5 w-10 rounded-full bg-slate-200"></div>

  <div class="flex items-start justify-between gap-3">
    <div class="min-w-0">
      <h2 id="sheet-title" class="font-bold leading-tight">הוספה לתכנית</h2>
      <p id="sheet-place" class="truncate text-xs text-slate-500"></p>
    </div>
    <button id="sheet-close" type="button" aria-label="סגור"
            class="shrink-0 rounded-full bg-slate-100 px-2.5 py-1 text-sm text-slate-500 active:scale-90 transition">✕</button>
  </div>

  <!-- planned / visited -->
  <div id="sheet-mode" class="mt-3 flex gap-1 rounded-lg bg-slate-200 p-0.5 text-xs"></div>

  <!-- manual place fields — shown only when adding a place that isn't in the bank -->
  <div id="sheet-manual" hidden class="mt-3 space-y-2">
    <label class="block">
      <span class="text-xs font-semibold text-slate-500">שם המקום <span class="text-rose-500">*</span></span>
      <input id="sheet-name" type="text" autocomplete="off" placeholder="למשל: Café Central"
             class="mt-1 w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 outline-none focus:border-ink focus:ring-2 focus:ring-ink/20">
    </label>
    <label class="block">
      <span class="text-xs font-semibold text-slate-500">קישור מ-Google Maps (אופציונלי)</span>
      <input id="sheet-link" type="url" inputmode="url" autocomplete="off" dir="ltr"
             placeholder="הדבקו כאן קישור או קואורדינטות"
             class="mt-1 w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 outline-none focus:border-ink focus:ring-2 focus:ring-ink/20">
    </label>
    <p id="sheet-link-help" class="text-[11px] leading-relaxed text-slate-400"></p>
    <!-- Shown only when a pasted link can't be decoded: opens it so the address
         or coordinates can be copied from Google Maps and pasted back here. -->
    <a id="sheet-link-open" hidden target="_blank" rel="noopener"
       class="rounded-xl bg-slate-100 px-3 py-2 text-xs font-semibold text-slate-700 active:scale-95 transition">
      🔗 פתחו את הקישור כדי להעתיק כתובת או קואורדינטות
    </a>
  </div>

  <!-- day quick-pick, then the date input as the escape hatch -->
  <p class="mt-3 text-xs font-semibold text-slate-500">תאריך</p>
  <div id="sheet-days" class="rail no-scrollbar mt-1 flex gap-1.5 overflow-x-auto pb-1"></div>

  <div class="mt-2 flex gap-2">
    <label class="flex-1">
      <span class="text-[11px] text-slate-400">תאריך</span>
      <input id="sheet-date" type="date"
             class="mt-0.5 w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 outline-none focus:border-ink">
    </label>
    <label class="flex-1">
      <span class="text-[11px] text-slate-400">שעה (אופציונלי)</span>
      <!-- step=1800s → the picker moves in half-hour jumps -->
      <input id="sheet-time" type="time" step="1800"
             class="mt-0.5 w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 outline-none focus:border-ink">
    </label>
  </div>

  <label class="mt-2 block">
    <span class="text-xs font-semibold text-slate-500">הערה</span>
    <textarea id="sheet-note" rows="2" placeholder="מה היה? מה כדאי לזכור?"
              class="mt-1 w-full resize-none rounded-xl border border-slate-300 bg-white px-3 py-2.5 outline-none focus:border-ink focus:ring-2 focus:ring-ink/20"></textarea>
  </label>

  <div class="sticky bottom-0 -mx-4 mt-3 flex gap-2 border-t border-slate-100 bg-white px-4 py-3">
    <button id="sheet-save" type="button"
            class="flex-1 rounded-xl bg-ink px-3 py-3 text-sm font-semibold text-white shadow-sm active:scale-[0.98] transition">שמור</button>
    <button id="sheet-delete" type="button" hidden
            class="rounded-xl bg-rose-50 px-3 py-3 text-sm font-semibold text-rose-600 ring-1 ring-rose-200 active:scale-95 transition">🗑 מחק</button>
  </div>
</div>

<!-- ============ TOAST ============ -->
<div id="toast" class="pointer-events-none fixed inset-x-0 bottom-24 z-[60] flex justify-center px-6 opacity-0 transition-opacity duration-300">
  <div id="toast-msg" class="max-w-sm rounded-xl bg-ink/95 px-4 py-2.5 text-center text-sm text-white shadow-xl"></div>
</div>

<script src="data.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
